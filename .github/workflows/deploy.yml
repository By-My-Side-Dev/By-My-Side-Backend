name: Build and deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_URI: ${{ secrets.ECR_URI }}
  IMAGE_TAG: ${{ github.sha }}
  APP_DIR: /home/azureuser/gyeote-project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify application build
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build \
            --tag "$ECR_URI:$IMAGE_TAG" \
            --tag "$ECR_URI:latest" \
            .
          docker push "$ECR_URI:$IMAGE_TAG"
          docker push "$ECR_URI:latest"

      - name: Get ECR token for Azure VM
        id: ecr-token
        run: |
          token="$(aws ecr get-login-password --region "$AWS_REGION")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: azureuser
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.blue.yml,docker/docker-compose.green.yml,script/deploy.sh"
          target: ${{ env.APP_DIR }}

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_URI: ${{ env.ECR_URI }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ECR_TOKEN: ${{ steps.ecr-token.outputs.token }}
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: azureuser
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          envs: ECR_URI,IMAGE_TAG,ECR_TOKEN
          script: |
            set -e
            registry="${ECR_URI%%/*}"
            echo "$ECR_TOKEN" | docker login --username AWS --password-stdin "$registry"
            chmod +x /home/azureuser/gyeote-project/script/deploy.sh
            /home/azureuser/gyeote-project/script/deploy.sh
