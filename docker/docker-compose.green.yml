name: gyeote-green

services:
  api:
    image: ${ECR_URI}:${IMAGE_TAG}
    container_name: gyeote-api-green
    restart: unless-stopped
    env_file:
      - /home/azureuser/gyeote-project/.env
    ports:
      - "8081:8080"
    networks:
      - infra_default

networks:
  infra_default:
    external: true