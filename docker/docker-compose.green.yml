name: gyeote-green

services:
  api:
    image: ${ACR_URI}:${IMAGE_TAG}
    container_name: gyeote-api-green
    restart: unless-stopped
    env_file:
      - /home/azureuser/app/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: "Asia/Seoul"
    volumes:
      - /home/azureuser/app/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8081:8080"
    networks:
      - infra_default

networks:
  infra_default:
    external: true
