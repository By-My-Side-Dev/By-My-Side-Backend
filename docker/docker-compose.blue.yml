name: gyeote-blue

services:
  api:
    image: ${ACR_URI}:${IMAGE_TAG}
    container_name: gyeote-api-blue
    restart: unless-stopped
    env_file:
      - /home/azureuser/app/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: "Asia/Seoul"
    volumes:
      - /home/azureuser/app/gyeote-dc282-firebase-adminsdk-fbsvc-1f39cb766e.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
    networks:
      - infra_default

networks:
  infra_default:
    external: true
