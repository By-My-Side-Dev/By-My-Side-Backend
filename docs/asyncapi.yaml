asyncapi: 3.1.0
info:
  title: 곁에 실시간 위치 WebSocket API
  version: 1.0.0
  description: |
    긴급 호출 발신자의 위치를 실시간으로 전달하는 STOMP over WebSocket API입니다.

    연결 순서는 다음과 같습니다.

    1. `/ws`에 네이티브 WebSocket으로 연결합니다. SockJS는 지원하지 않습니다.
    2. STOMP `CONNECT` 프레임의 native header에 `Authorization: Bearer {accessToken}`과 `heart-beat: 20000,20000`을 담습니다.
    3. 수신자는 `/topic/emergency-alerts/{alertId}/location`을 구독하고, 발신자는 `/app/emergency-alerts/{alertId}/location`으로 위치를 전송합니다.
    4. 발신자는 비즈니스 오류를 `/user/queue/errors`에서 수신할 수 있습니다.

    서버와 클라이언트는 20초 간격으로 양방향 STOMP heartbeat를 교환합니다.
    클라이언트가 heartbeat를 지원하고 `CONNECT` 프레임에서 송수신 주기를 제안해야 실제 주기가 협상됩니다.
    약속된 시간 동안 heartbeat 또는 실제 메시지가 수신되지 않으면 상대방은 연결 실패로 판단하고 재연결해야 합니다.

    WebSocket 연결은 heartbeat 교환 여부와 관계없이 연결 시점부터 최대 1일(24시간)간 유지됩니다.
    24시간이 지나면 서버가 정상 종료 close frame을 전송하고 연결을 종료하므로, 계속 사용하려면 클라이언트가 다시 연결하고 필요한 채널을 재구독해야 합니다.

    `CONNECT` 인증 실패와 `SUBSCRIBE` 권한 실패는 STOMP `ERROR` 프레임으로 처리됩니다.
    `/topic` 또는 `/queue`로 직접 `SEND`하는 요청은 허용되지 않습니다.
  license:
    name: Proprietary
defaultContentType: application/json

servers:
  local:
    host: localhost:8080
    pathname: /ws
    protocol: ws
    protocolVersion: "13"
    description: 로컬 개발 서버의 STOMP over WebSocket 엔드포인트
    tags:
      - name: environment:local
    x-stomp-version: "1.2"
    x-max-connection-duration: PT24H
    x-stomp-connect-headers:
      Authorization:
        description: REST 로그인에서 발급받은 access token
        example: Bearer eyJhbGciOiJIUzI1NiJ9...
      heart-beat:
        description: 클라이언트 송신 및 수신 heartbeat 희망 주기(밀리초)
        example: 20000,20000
  production:
    host: gyeote.ai.kr
    pathname: /ws
    protocol: wss
    protocolVersion: "13"
    description: 운영 서버의 STOMP over secure WebSocket 엔드포인트
    tags:
      - name: environment:production
    x-stomp-version: "1.2"
    x-max-connection-duration: PT24H
    x-stomp-connect-headers:
      Authorization:
        description: REST 로그인에서 발급받은 access token
        example: Bearer eyJhbGciOiJIUzI1NiJ9...
      heart-beat:
        description: 클라이언트 송신 및 수신 heartbeat 희망 주기(밀리초)
        example: 20000,20000

channels:
  emergencyLocationUpdateCommand:
    address: /app/emergency-alerts/{alertId}/location
    title: 긴급 호출 위치 갱신
    description: |
      긴급 호출 발신자가 현재 좌표를 서버에 전송하는 STOMP `SEND` 목적지입니다.
      실시간 위치 공유가 활성화되어 있고 종료되지 않은 호출의 발신자만 전송할 수 있습니다.
      서버는 기본 15초의 최소 갱신 간격을 적용하며, 좌표를 소수점 이하 7자리로 반올림해 저장합니다.
    servers:
      - $ref: "#/servers/local"
      - $ref: "#/servers/production"
    parameters:
      alertId:
        $ref: "#/components/parameters/alertId"
    messages:
      locationUpdateRequest:
        $ref: "#/components/messages/locationUpdateRequest"

  emergencyLocationUpdatedEvent:
    address: /topic/emergency-alerts/{alertId}/location
    title: 긴급 호출 위치 구독
    description: |
      서버가 갱신된 좌표를 브로드캐스트하는 STOMP `SUBSCRIBE` 목적지입니다.
      해당 긴급 호출의 유효한 수신자이면서 실시간 위치 수신을 허용한 사용자만 구독할 수 있습니다.
    servers:
      - $ref: "#/servers/local"
      - $ref: "#/servers/production"
    parameters:
      alertId:
        $ref: "#/components/parameters/alertId"
    messages:
      locationUpdated:
        $ref: "#/components/messages/locationUpdated"

  userBusinessError:
    address: /user/queue/errors
    title: 사용자별 비즈니스 오류 구독
    description: |
      위치 갱신 처리 중 발생한 비즈니스 오류를 발신자에게만 전달하는 STOMP `SUBSCRIBE` 목적지입니다.
      위치를 보내기 전에 한 번 구독하고 연결을 유지하는 것을 권장합니다.
    servers:
      - $ref: "#/servers/local"
      - $ref: "#/servers/production"
    messages:
      businessError:
        $ref: "#/components/messages/businessError"

operations:
  receiveEmergencyLocationUpdate:
    action: receive
    title: 발신자의 실시간 위치 갱신 수신
    summary: 서버가 긴급 호출 발신자의 현재 좌표를 수신합니다.
    description: |
      클라이언트는 이 채널에 STOMP `SEND`합니다. 성공 응답은 별도로 없으며, 저장된 좌표는 위치 구독 채널로 브로드캐스트됩니다.
    channel:
      $ref: "#/channels/emergencyLocationUpdateCommand"
    messages:
      - $ref: "#/channels/emergencyLocationUpdateCommand/messages/locationUpdateRequest"

  sendEmergencyLocationUpdated:
    action: send
    title: 수신자에게 실시간 위치 전송
    summary: 서버가 허가된 구독자에게 정규화된 최신 좌표를 전송합니다.
    channel:
      $ref: "#/channels/emergencyLocationUpdatedEvent"
    messages:
      - $ref: "#/channels/emergencyLocationUpdatedEvent/messages/locationUpdated"

  sendUserBusinessError:
    action: send
    title: 발신자에게 위치 갱신 오류 전송
    summary: 서버가 위치 갱신을 요청한 사용자에게 비즈니스 오류를 전송합니다.
    channel:
      $ref: "#/channels/userBusinessError"
    messages:
      - $ref: "#/channels/userBusinessError/messages/businessError"

components:
  parameters:
    alertId:
      description: 긴급 호출 식별자
      examples:
        - "42"

  messages:
    locationUpdateRequest:
      name: RealtimeLocationUpdateRequest
      title: 실시간 위치 갱신 요청
      summary: 발신자의 현재 위도와 경도
      contentType: application/json
      payload:
        $ref: "#/components/schemas/realtimeLocationUpdateRequest"
      examples:
        - name: 서울시청 인근 위치 갱신
          payload:
            latitude: 37.566535
            longitude: 126.9779692

    locationUpdated:
      name: RealtimeLocationUpdateResponse
      title: 실시간 위치 갱신 이벤트
      summary: 서버가 저장 후 브로드캐스트하는 정규화된 좌표
      contentType: application/json
      payload:
        $ref: "#/components/schemas/realtimeLocationUpdateResponse"
      examples:
        - name: 긴급 호출 42의 최신 위치
          payload:
            alertId: 42
            latitude: 37.5665350
            longitude: 126.9779692

    businessError:
      name: ApiErrorResponse
      title: 위치 갱신 비즈니스 오류
      summary: 위치 갱신이 거부되었을 때 사용자 큐로 전달되는 오류
      contentType: application/json
      payload:
        $ref: "#/components/schemas/apiErrorResponse"
      examples:
        - name: 갱신 간격 제한
          payload:
            code: COMMON_TOO_MANY_REQUESTS
            message: 요청 횟수가 너무 많습니다.
            data: null
        - name: 종료된 호출
          payload:
            code: COMMON_CONFLICT
            message: 이미 처리되었거나 중복된 요청입니다.
            data: null

  schemas:
    realtimeLocationUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
          examples:
            - 37.566535
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
          examples:
            - 126.9779692

    realtimeLocationUpdateResponse:
      type: object
      additionalProperties: false
      required:
        - alertId
        - latitude
        - longitude
      properties:
        alertId:
          type: integer
          format: int64
          minimum: 1
          description: 긴급 호출 식별자
          examples:
            - 42
        latitude:
          type: number
          minimum: -90
          maximum: 90
          multipleOf: 0.0000001
          description: 소수점 이하 7자리로 정규화된 WGS84 위도
          examples:
            - 37.5665350
        longitude:
          type: number
          minimum: -180
          maximum: 180
          multipleOf: 0.0000001
          description: 소수점 이하 7자리로 정규화된 WGS84 경도
          examples:
            - 126.9779692

    apiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          description: 위치 갱신에서 발생할 수 있는 비즈니스 오류 코드
          enum:
            - COMMON_NOT_FOUND
            - COMMON_FORBIDDEN
            - COMMON_CONFLICT
            - COMMON_TOO_MANY_REQUESTS
        message:
          type: string
          description: 사용자에게 표시할 수 있는 오류 메시지
        data:
          type: "null"
          description: 오류 응답에서는 항상 null
