spring:
  application:
    name: gyeote-api
  datasource:
    url: jdbc:mysql://localhost:3306/gyeote?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_IP}
      port: ${REDIS_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000     # 30분
  refresh-token-validity-ms: 2592000000 # 30일

phone:
  enc-key: ${PHONE_ENC_KEY}         # AES-256 키 (Base64 인코딩 32바이트)
  hmac-secret: ${PHONE_HMAC_SECRET} # 블라인드 인덱스 HMAC secret
  pepper: ${PHONE_PEPPER}           # 사전 대입 방지용 고정 솔트
