spring:
  application:
    name: gyeote-api
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000     # 30분
  refresh-token-validity-ms: 2592000000 # 30일

phone:
  enc-key: ${PHONE_ENC_KEY}
  hmac-secret: ${PHONE_HMAC_SECRET}
  pepper: ${PHONE_PEPPER}

social:
  oauth:
    google:
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS}
    apple:
      client-ids: ${APPLE_OAUTH_CLIENT_IDS}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
