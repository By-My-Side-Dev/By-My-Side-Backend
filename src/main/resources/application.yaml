spring:
  application:
    name: gyeote-api
  profiles:
    default: local
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000     # 30분
  refresh-token-validity-ms: 2592000000 # 30일

mail:
  from: ${MAIL_FROM:}

phone:
  enc-key: ${PHONE_ENC_KEY}
  hmac-secret: ${PHONE_HMAC_SECRET}
  pepper: ${PHONE_PEPPER}

device-token:
  # 전용 Base64로 인코딩된 AES 키여야 합니다. 휴대폰 암호화에 사용되는 키와 공유해서는 안 됩니다.
  enc-key: ${FCM_TOKEN_ENC_KEY}

fcm:
  max-attempts: 5
  batch-size: 100
  scheduler:
    fixed-delay-ms: 15000
  project-id: ${FIREBASE_PROJECT_ID}

social:
  oauth:
    google:
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS}
    apple:
      client-ids: ${APPLE_OAUTH_CLIENT_IDS}

reverse-geocoding:
  kakao:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY}

emergency:
  # 실시간 위치 WebSocket 갱신의 최소 간격
  location-update-interval-seconds: 15

websocket:
  # WebSocket 연결은 생성 시점부터 최대 1일간 유지한다.
  max-session-duration: 1d
  heartbeat:
    # Nginx의 60초 유휴 타임아웃보다 짧은 주기로 양방향 생존 신호를 교환한다.
    server-to-client-interval-ms: 20000
    client-to-server-interval-ms: 20000

management:
  health:
    mail:
      # SMTP 장애가 애플리케이션 전체 배포 헬스 체크를 실패시키지 않게 한다.
      enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
