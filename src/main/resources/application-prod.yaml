spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false # 불필요한 SQL 포멧을 제거
    show-sql: false # 운영 로그에 불필요한 SQL 제거
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway 도입 전에 수동 반영된 마지막 마이그레이션 버전이다.
    baseline-version: "20260910.01"
    baseline-description: gyeote schema before flyway
    # 기존 운영 스키마에 최초 배포할 때 schema history를 생성한다.
    baseline-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_IP}
      port: ${REDIS_PORT}

azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT_NAME}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME}

websocket:
  allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}
