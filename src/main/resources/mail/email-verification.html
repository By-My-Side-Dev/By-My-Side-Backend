<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>내곁에 · {{action}} 이메일 인증</title>
</head>
<body bgcolor="#1a1a1a" style="margin:0;padding:0;background-color:#1a1a1a;color:#ffffff;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;font-size:1px;line-height:1px;color:#1a1a1a;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">내곁에 {{action}} 인증번호 안내입니다. 발급 후 5분 이내에 앱에 입력해주세요.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1a1a1a" style="background-color:#1a1a1a;">
    <tr>
      <td align="center" style="padding:36px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
          <tr>
            <td align="center" style="padding:0 8px 24px;">
              <table role="presentation" width="64" cellpadding="0" cellspacing="0" border="0" style="width:64px;margin:0 auto;">
                <tr>
                  <td align="center" valign="middle" width="64" height="64" bgcolor="#2e1e1e" style="width:64px;height:64px;border-radius:50%;background-color:#2e1e1e;">
                    <table role="presentation" width="46" cellpadding="0" cellspacing="0" border="0" style="width:46px;">
                      <tr>
                        <td align="center" valign="middle" width="46" height="46" bgcolor="#4b2525" style="width:46px;height:46px;border-radius:50%;background-color:#4b2525;">
                          <table role="presentation" width="28" cellpadding="0" cellspacing="0" border="0" style="width:28px;">
                            <tr><td width="28" height="28" bgcolor="#E24B4A" style="width:28px;height:28px;border-radius:50%;background-color:#E24B4A;font-size:0;line-height:0;">&nbsp;</td></tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <p style="margin:14px 0 0;padding-left:8px;font-size:24px;line-height:34px;font-weight:500;letter-spacing:8px;color:#ffffff;">내곁에</p>
            </td>
          </tr>
          <tr>
            <td bgcolor="#0D0D0D" style="background-color:#0D0D0D;border:1px solid #2a2a2a;border-radius:20px;overflow:hidden;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:28px 28px 0;">
                    <p style="margin:0 0 12px;font-size:11px;line-height:18px;font-weight:600;letter-spacing:2px;color:#E24B4A;">EMAIL VERIFICATION</p>
                    <h1 style="margin:0;font-size:26px;line-height:38px;font-weight:600;letter-spacing:-0.5px;color:#ffffff;">{{action}}을 위한<br>이메일 인증 안내</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:28px;">
                    <p style="margin:0 0 24px;font-size:15px;line-height:26px;word-break:keep-all;white-space: pre-line;color:#aaaaaa;">{{description}}</p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#181818" style="background-color:#181818;border:1px solid #E24B4A;border-radius:12px;">
                      <tr>
                        <td align="center" style="padding:22px 8px;">
                          <p style="margin:0 0 10px;font-size:12px;line-height:20px;color:#aaaaaa;">앱에 입력할 인증번호</p>
                          <p dir="ltr" style="margin:0;font-family:'Courier New',monospace;font-size:36px;line-height:48px;font-weight:700;letter-spacing:6px;color:#ffffff;">{{code}}</p>
                          <p style="margin:12px 0 0;font-size:12px;line-height:20px;color:#aaaaaa;">유효시간 <strong style="font-weight:500;color:#E24B4A;">발급 후 5분</strong></p>
                        </td>
                      </tr>
                    </table>
                    <p style="margin:20px 0 0;font-size:13px;line-height:23px;color:#aaaaaa;">인증번호는 누구에게도 알려주지 마세요.<br>유효시간이 지나면 앱에서 새 인증번호를 요청해주세요.</p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:26px;">
                      <tr>
                        <td style="border-top:1px solid #2a2a2a;padding-top:20px;">
                          <p style="margin:0;font-size:12px;line-height:21px;color:#888888;">본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.<br>이 메일은 발신 전용으로, 회신을 받지 않습니다.</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:22px 12px 0;">
              <p style="margin:0;font-size:12px;line-height:22px;letter-spacing:0.5px;color:#888888;">위기 순간, 곁에 있어드릴게요</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
